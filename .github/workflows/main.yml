name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app
        working-directory: artifacts/trolley
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          BASE_PATH: /
        run: pnpm exec vite build

      - name: Add Android platform and sync
        working-directory: artifacts/trolley
        run: |
          pnpm add @capacitor/android@^8.6.2
          pnpm exec cap add android
          pnpm exec cap sync android

      - name: Build debug APK
        working-directory: artifacts/trolley/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: trolley-apk
          path: artifacts/trolley/android/app/build/outputs/apk/debug/app-debug.apk
