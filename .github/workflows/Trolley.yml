name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app
        working-directory: artifacts/trolley
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          BASE_PATH: /
        run: pnpm exec vite build

      - name: Add Android platform
        working-directory: artifacts/trolley
        run: |
          pnpm add @capacitor/android@^8.6.2
          pnpm exec cap add android

      - name: Generate app icon and splash from logo
        working-directory: artifacts/trolley
        run: |
          pnpm add -D @capacitor/assets
          mkdir -p resources
          python3 -m pip install --break-system-packages pillow
          python3 - <<'PY'
          from PIL import Image
          logo = Image.open('public/trolley-logo.jpg').convert('RGB')
          logo.resize((1024, 1024), Image.LANCZOS).save('resources/icon.png')
          splash = Image.new('RGB', (2732, 2732), (0, 0, 0))
          small = logo.resize((900, 900), Image.LANCZOS)
          splash.paste(small, ((2732 - 900) // 2, (2732 - 900) // 2))
          splash.save('resources/splash.png')
          splash.save('resources/splash-dark.png')
          PY
          pnpm exec capacitor-assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'
          sed -i 's|<item name="android:background">@null</item>|<item name="android:background">@null</item><item name="android:windowBackground">#000000</item>|' android/app/src/main/res/values/styles.xml || true

      - name: Sync Capacitor
        working-directory: artifacts/trolley
        run: pnpm exec cap sync android

      - name: Build debug APK
        working-directory: artifacts/trolley/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: trolley-apk
          path: artifacts/trolley/android/app/build/outputs/apk/debug/app-debug.apk
