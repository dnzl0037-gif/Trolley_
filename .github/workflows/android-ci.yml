name: Android CI & Firestore Rules

on:
  push:
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  android-build-and-test:
    name: Android Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK & Licenses
        uses: android-actions/setup-android@v3

      - name: Decode debug signing keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run JVM Unit Tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trolley-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  firestore-security-rules:
    name: Firestore Security Rules Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up JDK 21 for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Firebase CLI & Rules Unit Testing
        run: |
          npm install -g firebase-tools
          npm install --prefix /tmp/rules-deps @firebase/rules-unit-testing firebase

      - name: Run Firestore Security Rules Test Suite
        env:
          NODE_PATH: /tmp/rules-deps/node_modules
        run: |
          firebase emulators:exec --only firestore --project demo-no-project \
            "FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 node --test firestore.test.js"
