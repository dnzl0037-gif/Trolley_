name: Android CI & Firestore Rules

on:
  push:
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  android-build-and-test:
    name: Android Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK & Accept Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            echo "::error::Android SDK directory not found at $SDK_DIR"
            exit 1
          fi
          if [ ! -w "$SDK_DIR" ]; then
            sudo chown -R "$(whoami)" "$SDK_DIR"
          fi
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager binary not found under $SDK_DIR/cmdline-tools"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-36"

      - name: Configure Firebase config and debug signing keystore
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            else
              echo "::warning::app/google-services.json omitted (secrets hidden); using CI placeholder config. Add GOOGLE_SERVICES_JSON GitHub Secret for live Firebase in CI APKs."
              cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder-project",
              "storage_bucket": "ci-placeholder-project.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.aistudio.trolley.kxpqzm"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "000000000000-ciplaceholder.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "CI_PLACEHOLDER_API_KEY"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "000000000000-ciplaceholder.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
            fi
          fi

          if [ ! -f debug.keystore ]; then
            if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
              printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            elif [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "::warning::debug.keystore.base64 missing; generating CI debug.keystore"
              keytool -genkeypair -keystore debug.keystore -storepass android \
                -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
                -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
          cache-provider: basic

      - name: Run JVM Unit Tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: trolley-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  firestore-security-rules:
    name: Firestore Security Rules Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up JDK 21 for Firestore Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Firebase CLI & Rules Unit Testing
        run: |
          npm install -g firebase-tools
          npm install --prefix /tmp/rules-deps @firebase/rules-unit-testing firebase

      - name: Run Firestore Security Rules Test Suite
        env:
          NODE_PATH: /tmp/rules-deps/node_modules
        run: |
          firebase emulators:exec --only firestore --project demo-no-project \
            "FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 node --test firestore.test.js"
