<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10110f" />
    <meta name="description" content="Find trusted local professionals and services with Trolley." />
    <title>Trolley — Find the right professional</title>
    <link rel="icon" type="image/jpeg" href="/trolley-logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      html,body{background:#000}
      #splash{position:fixed;inset:0;z-index:99999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .45s ease}
      #splash.hide{opacity:0;pointer-events:none}
      #splash img{width:132px;height:132px;border-radius:30px;animation:spLogo .7s cubic-bezier(.2,.9,.3,1.2) both}
      #splash .sp-name{display:flex;font:800 44px Manrope,'DM Sans',sans-serif;letter-spacing:-1.5px;color:#fff}
      #splash .sp-name span{display:inline-block;opacity:0;transform:translateY(18px);animation:spLetter .5s ease forwards;animation-delay:calc(.45s + var(--i) * .08s)}
      #splash .sp-name .sp-dot{color:#f26a38}
      @keyframes spLogo{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
      @keyframes spLetter{to{opacity:1;transform:none}}
      @media(prefers-reduced-motion:reduce){#splash .sp-name span{opacity:1!important;transform:none!important}}
    </style>
  </head>
  <body><div id="splash"><img src="/trolley-logo.jpg" alt=""/><div class="sp-name" aria-label="trolley"><span style="--i:0">t</span><span style="--i:1">r</span><span style="--i:2">o</span><span style="--i:3">l</span><span style="--i:4">l</span><span style="--i:5">e</span><span style="--i:6">y</span><span class="sp-dot" style="--i:7">.</span></div></div><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
